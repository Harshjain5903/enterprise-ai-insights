[project]
name = "enterprise-ai-insights"
version = "0.1.0"
description = "BigQuery + Gemini weekly retail reporting with validated, cited insights"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-bigquery>=3.20",
    "google-genai>=1.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
insights = "insights.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["insights*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:google.*"]

[tool.setuptools.package-data]
"insights.prompts" = ["*.txt"]
